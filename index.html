<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharp Platform</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <section id="loginView" class="panel auth-panel">
        <div class="panel-header">
          <h1>登录</h1>
        </div>
        <form id="loginForm" class="form-stack">
          <label>
            <span>手机号</span>
            <input id="mobile" type="tel" value="" placeholder="请输入手机号" required />
          </label>
          <label>
            <span>密码</span>
            <input id="password" type="password" value="" placeholder="请输入密码" required />
          </label>

          <div class="captcha-row">
            <label>
              <input id="captchaInput" type="text" placeholder="输入图片中的字符" required/>
            </label>
            <div class="captcha-box">
              <img id="captchaImage" alt="验证码" title="点击刷新验证码" />
              <button id="refreshCaptchaBtn" type="button" class="secondary-btn tiny-btn">刷新</button>
            </div>
          </div>
          <button type="submit" class="primary-btn">登录</button>

          <div class="sms-section">
            <span>短信验证码</span>
            <div class="sms-row">
              <label>
                <input id="smsCodeInput" type="text" placeholder="输入短信验证码" />
              </label>
              <div class="sms-actions">
                <button id="getSmsBtn" type="button" class="secondary-btn">获取验证码</button>
              </div>
            </div>
            <button id="smsLoginBtn" type="button" class="primary-btn">使用短信登录</button>
            <p id="smsStatus" class="status-text"></p>
          </div>

          <p class="auth-link-row">
            没有账号？ <a id="goRegisterLink" href="#" class="auth-link">注册</a>
          </p>
        </form>
      </section>

      <section id="registerView" class="panel auth-panel hidden">
        <div class="panel-header">
          <h1>注册</h1>
        </div>
        <form id="registerForm" class="form-stack">
          <label>
            <span>昵称</span>
            <input id="registerNickname" type="text" placeholder="请输入昵称" required />
          </label>
          <label>
            <span>手机号</span>
            <input id="registerMobile" type="tel" placeholder="请输入手机号" required />
          </label>
          <label>
            <span>密码</span>
            <input id="registerPassword" type="password" placeholder="请输入密码" required />
          </label>

          <div class="sms-row register-code-row">
            <label>
              <!-- <span>注册验证码</span> -->
              <input id="registerCodeInput" type="text" placeholder="输入短信验证码" />
            </label>
            <button id="getRegisterSmsBtn" type="button" class="secondary-btn">获取验证码</button>
          </div>

          <button id="registerSubmitBtn" type="submit" class="primary-btn">注册</button>
          <p id="registerStatus" class="status-text"></p>
          <p class="auth-link-row">
            已有账号？ <a id="goLoginLink" href="#" class="auth-link">返回登录</a>
          </p>
        </form>
      </section>

      <section id="homeView" class="panel hidden">
        <div class="panel-header home-header">
          <div>
            <p class="eyebrow">欢迎</p>
            <h1 id="welcomeText">首页</h1>
          </div>
          <button id="logoutBtn" class="secondary-btn" type="button">退出登录</button>
        </div>

        <div class="content-grid">
          <div class="card">
            <h2>上传文件</h2>
            <div class="form-stack compact-form">
              <label>
                <span>公司 ID</span>
                <input id="groupId" type="number" min="1" value="999" />
              </label>
              <label>
                <span>分组名称</span>
                <input id="groupName" type="text" value="upload" placeholder="例如 upload" />
              </label>
              <label>
                <span>选择文件</span>
                <input id="uploadFile" type="file" />
              </label>
              <button id="uploadBtn" type="button" class="primary-btn">上传</button>
            </div>
            <p id="uploadStatus" class="status-text"></p>
          </div>

          <div class="card action-card">
            <h2>消息测试</h2>

            <button id="sendMessageBtn" type="button" class="primary-btn">获取服务端消息</button>
            <p id="sendMessageStatus" class="status-text"></p>

            <hr />
            <textarea id="stompMessageInput" rows="3" placeholder="输入要发送的消息内容">内容</textarea>
            <button id="sendMessage2Btn" type="button" class="secondary-btn">发送消息</button>
            
            <hr />
            <div class="erp-row">
              <button id="erpBtn" type="button" class="primary-btn">erp(admin 允许访问)</button>
              <p id="erpStatus" class="status-text"></p>
              <pre id="erpData" class="erp-data" aria-live="polite"></pre>
            </div>
          </div>

          <div class="card">
            <h2>已上传文件</h2>
            <ul id="fileList" class="file-list"></ul>
          </div>
        </div>
      </section>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <div id="dialogOverlay" class="dialog-overlay hidden" aria-live="assertive">
      <div class="dialog-modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <h3 id="dialogTitle">提示</h3>
        <p id="dialogMessage"></p>
        <button id="dialogCloseBtn" type="button" class="primary-btn">确定</button>
      </div>
    </div>

    <script src="./vendor/sockjs.min.js"></script>
    <script src="./vendor/stomp.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
