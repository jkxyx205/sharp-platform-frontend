<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>STOMP over SockJS 测试</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #messages { max-height: 300px; overflow: auto; border: 1px solid #ddd; padding: 10px; }
    #messages li { margin: 6px 0; }
    .small { color: #666; font-size: 0.9em; }
  </style>

  <!-- SockJS 与 Stomp.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
  <h2>STOMP + SockJS 测试客户端</h2>

  <div>
    <label>messageUrl（base）:
      <input id="messageUrl" value="http://localhost:8769/api/platform" style="width:420px"/>
    </label>
  </div>
  <div style="margin-top:8px;">
    <label>access_token:
      <input id="token" placeholder="在此填写 token" style="width:300px"/>
    </label>
  </div>

  <div style="margin-top:8px;">
    <button id="connectBtn">连接并订阅 /user/queue/message</button>
    <button id="disconnectBtn" disabled>断开</button>
    <span id="status" class="small" style="margin-left:12px;">未连接</span>
  </div>

  <h3>接收的消息</h3>
  <ul id="messages"></ul>

  <script>
    let client = null;
    let connected = false;
    let reconnectAttempts = 0;

    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');

    function setStatus(txt) { statusEl.textContent = txt; }
    function addMessage(txt) {
      const li = document.createElement('li');
      li.textContent = new Date().toLocaleTimeString() + ' — ' + txt;
      messagesEl.insertBefore(li, messagesEl.firstChild);
    }

    function buildSockJsUrl(base, token) {
      // 确保没有尾部斜杠重复
      if (base.endsWith('/')) base = base.slice(0, -1);
      return base + '/ws/message?access_token=' + encodeURIComponent(token);
    }

    function connect() {
      const base = document.getElementById('messageUrl').value.trim();
      const token = document.getElementById('token').value.trim();
      if (!base) { alert('请填写 messageUrl'); return; }
      if (!token) { alert('请填写 access_token'); return; }

      setStatus('连接中...');
      connectBtn.disabled = true;

      const url = buildSockJsUrl(base, token);
      const socket = new SockJS(url);

      // 使用 Stomp.over(sockjs)
      client = Stomp.over(socket);
      // 关闭默认调试日志，方便查看
      client.debug = function() {};
      // 连接（headers 可按需传）
      client.connect({}, function(frame) {
        connected = true;
        reconnectAttempts = 0;
        setStatus('已连接');
        disconnectBtn.disabled = false;
        addMessage('CONNECTED: ' + (frame && frame.command ? frame.command : 'OK'));

        // 订阅 /user/queue/message（服务器端会把消息发到该 user 目的地）
        client.subscribe('/user/queue/message', function(message) {
          let body = message.body;
          try { body = JSON.parse(body); }
          catch (e) { /* not JSON */ }
          addMessage('收到消息: ' + (typeof body === 'object' ? JSON.stringify(body) : body));
        });
      }, function(error) {
        connected = false;
        disconnectBtn.disabled = true;
        connectBtn.disabled = false;
        const errText = (typeof error === 'string' ? error : JSON.stringify(error));
        setStatus('连接断开: ' + (errText || 'connection lost'));
        addMessage('断开: ' + errText);

        // 自动重连（指数退避）
        reconnectAttempts++;
        const delay = Math.min(30000, 1000 * Math.pow(2, Math.min(6, reconnectAttempts)));
        setStatus('重连中，等待 ' + (delay/1000) + ' 秒...');
        setTimeout(function() {
          setStatus('重连尝试 #' + reconnectAttempts);
          connect();
        }, delay);
      });
    }

    function disconnect() {
      if (client && connected) {
        client.disconnect(function() {
          connected = false;
          setStatus('已断开（客户端触发）');
          addMessage('Client disconnected');
          disconnectBtn.disabled = true;
          connectBtn.disabled = false;
        });
      } else {
        setStatus('未连接');
      }
    }

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
  </script>
</body>
</html>
